<!doctype html>
<html lang="he">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{padding:0}body{margin:0}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>Offerwall Team Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: phone-width rewards-wall feed. Illustrated hero, filter tabs, two shelves of glossy gold game cards with cartoon scenes, slide-up detail sheet. */
:root{
  --bg:#0E1730;
  --surface:#18264A;
  --line:#2A3A63;
  --ink:#F4F6FC;
  --muted:#9AA8C7;
  --gold1:#D1A313;
  --gold2:#A67C00;
  --lime:#C6F432;
  --coral:#FF5A5F;
  --waze:#33CCFF;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.gem{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.app{max-width:480px;margin-inline:auto;min-height:100%;position:relative;overflow-x:clip}

/* HERO */
.hero{position:relative;height:320px;overflow:hidden;display:grid;place-items:center;text-align:center;
  padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px))}
.hero > svg{position:absolute;inset:0;width:100%;height:100%}
.faces{position:absolute;inset:0;z-index:1}
.face{position:absolute;width:11.6%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4),0 0 0 2px rgba(10,18,44,.55);background:#18264A}
.hero .txt{position:relative;z-index:2;margin-top:6px}
.hero h1{margin:0;line-height:1;font-weight:900;font-size:clamp(30px,9vw,40px);color:#fff;
  -webkit-text-stroke:2px #0A2A6B;paint-order:stroke fill;
  text-shadow:0 4px 0 #0A2A6B,0 8px 14px rgba(0,0,0,.35)}
.hero h1 .l2{display:block;font-size:clamp(36px,10.5vw,50px);margin-top:2px;
  background:linear-gradient(180deg,#FFF3A0 0%,#FFD23F 45%,#E39A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:0;filter:drop-shadow(0 3px 0 #6B3F00) drop-shadow(0 0 1px #6B3F00)}
.hero .when{display:inline-block;margin-top:12px;padding:5px 16px;border-radius:99px;background:var(--lime);color:#12210A;font-weight:800;font-size:15px;box-shadow:0 3px 0 #8FB31B}
.balance{position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top, 0px));inset-inline-start:max(14px, env(safe-area-inset-right, 0px));
  display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:99px;background:rgba(8,16,40,.72);font-weight:800;font-size:16px;backdrop-filter:blur(4px)}
.balance .gem{font-size:20px}

/* PROGRESS */
.progress{padding:14px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px))}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.progress .t{font-weight:700}
.progress .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar i{height:9px;border-radius:99px;background:var(--line);transition:background .25s}
.bar i.on{background:var(--lime)}

/* TABS */
.tabs{display:flex;gap:6px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;font-size:18px;color:var(--muted);font-weight:500;position:relative}
.tab[aria-selected="true"]{color:#FFD23F;font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:auto 12px -1px;height:3px;border-radius:3px;background:#FFD23F}

/* SHELVES */
.shelf{padding:26px 0 8px}
.shelf + .shelf{border-top:1px solid var(--line);margin-top:18px}
.shelf[hidden]{display:none}
.shelf-h{display:flex;align-items:center;gap:14px;padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px));margin-bottom:16px}
.shelf-h svg{width:40px;height:40px;flex:none}
.shelf-h h2{margin:0;font-size:23px;font-weight:800;line-height:1.15}
.shelf-h p{margin:2px 0 0;color:var(--muted);font-size:14px}

.row-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px))}

/* CARDS */
.card{display:block;text-align:start;border-radius:22px;overflow:hidden;position:relative;min-width:0;
  background:linear-gradient(180deg,var(--gold1),var(--gold2));
  box-shadow:0 10px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.card:active{transform:scale(.98)}
.card.big{flex:0 0 80%;scroll-snap-align:start}
.card .art{position:relative;overflow:hidden;line-height:0}
.card.big .art{height:176px}
.card.mini .art{height:132px}
.card .art > svg{width:100%;height:100%;display:block}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 38%);pointer-events:none}
.pill{position:absolute;z-index:2;top:10px;display:flex;align-items:center;gap:5px;line-height:1;padding:6px 10px;border-radius:99px;background:rgba(10,18,44,.78);color:#fff;font-weight:800;font-size:14px;backdrop-filter:blur(4px)}
.pill.l{inset-inline-start:10px}
.pill.r{inset-inline-end:10px}
.pill .gem{font-size:16px}
.pill.done{background:var(--lime);color:#12210A}
.gbar{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff;text-shadow:0 1px 0 rgba(60,40,0,.55)}
.tile{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 3px 6px rgba(0,0,0,.3)}
.tile svg{width:26px;height:26px;fill:#fff;text-shadow:none}
.gbar .tx{flex:1;min-width:0}
.ti{font-weight:800;font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su{font-size:13px;color:#FFF3C4;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw{flex:none;text-align:end;line-height:1.05}
.rw small{display:block;font-size:11px;letter-spacing:.06em;font-weight:700;color:#FFF3C4}
.rw b{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}
.rw b .gem{font-size:18px}
.card.mini .gbar{display:block;padding:11px 12px 12px}
.card.mini .ti{white-space:normal;font-size:16px}
.card.mini .su{white-space:normal}
.card.mini .rw{display:flex;align-items:baseline;justify-content:flex-start;gap:8px;margin-top:8px;text-align:start}
.card.mini .rw small{display:inline}
.card.mini .rw b{font-size:21px}

.foot{padding:26px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));text-align:center;color:var(--muted);font-size:13px}

/* DETAIL SHEET */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:480px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.s-art{height:260px;flex:none;border-radius:0 0 28px 28px;overflow:hidden;line-height:0;position:relative}
.s-art > svg{width:100%;height:100%}
.back{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top, 0px));inset-inline-start:max(14px, env(safe-area-inset-right, 0px));
  width:44px;height:44px;border-radius:50%;background:rgba(14,23,48,.75);display:grid;place-items:center;font-size:22px;backdrop-filter:blur(4px)}
.s-body{padding:22px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));flex:1}
.s-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.chip.time{background:var(--lime);color:#12210A;border-color:transparent}
.s-body h2{margin:0;font-size:32px;font-weight:900;line-height:1.1}
.s-body .lead{margin:8px 0 0;color:var(--muted);font-size:16px}
.reward{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:linear-gradient(180deg,var(--gold1),var(--gold2));font-weight:800;text-shadow:0 1px 0 rgba(60,40,0,.5)}
.reward .gem{font-size:24px}
.s-body h3{margin:26px 0 12px;font-size:14px;letter-spacing:.08em;color:#FFD23F;font-weight:800}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:#FFD23F;color:#2B2100;font-weight:900;display:grid;place-items:center;font-size:14px;margin-top:1px}
.cta{position:sticky;bottom:0;padding:14px max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,rgba(14,23,48,0),var(--bg) 28%);display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;font-weight:800;font-size:18px;width:100%}
.btn.waze{background:var(--waze);color:#06223B;box-shadow:0 6px 0 #1596BE}
.btn.waze:active{transform:translateY(3px);box-shadow:0 3px 0 #1596BE}
.btn.ok{background:var(--surface);border:2px solid var(--line);color:var(--ink);height:50px;font-size:16px}
.btn.ok[aria-pressed="true"]{background:var(--lime);color:#12210A;border-color:var(--lime)}
.btn.main-ok{background:var(--lime);color:#12210A;box-shadow:0 6px 0 #8FB31B}
.btn.main-ok[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
/* TRIVIA GAME */
.grid1{padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.g-wrap{padding:calc(76px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 32px max(18px, env(safe-area-inset-left, 0px));display:grid;gap:16px;align-content:start}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.g-score{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-variant-numeric:tabular-nums}
.g-prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.g-prog i{height:8px;border-radius:99px;background:var(--line)}
.g-prog i.ok{background:var(--lime)}
.g-prog i.no{background:var(--coral)}
.g-prog i.cur{background:#FFD23F}
.g-q{font-size:26px;font-weight:900;line-height:1.2;margin:8px 0 2px;text-wrap:balance}
.g-ans{display:grid;gap:10px}
.g-opt{text-align:start;padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-size:17px;font-weight:600;color:var(--ink);width:100%}
.g-opt:not(:disabled):active{transform:scale(.98)}
.g-opt:disabled{cursor:default}
.g-opt.right{background:#1C5A2C;border-color:var(--lime)}
.g-opt.wrong{background:#6B1F28;border-color:var(--coral)}
.g-note{padding:12px 14px;border-radius:14px;background:var(--surface);color:var(--muted);font-size:15px}
.g-res{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:8px}
.g-big{font-size:76px;font-weight:900;line-height:1;color:#FFD23F;font-variant-numeric:tabular-nums}
.g-title{font-size:28px;font-weight:900;line-height:1.15}
.g-res p{margin:0;color:var(--muted);font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- Illustrations (original cartoon scenes) ---------- */
var uid = 0;
function svgWrap(vb, inner){ return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+inner+'</svg>'; }

function sparkle(x,y,s,c){ return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10z" fill="'+c+'"/>'; }
function confetti(list){ return list.map(function(p){ return '<rect x="'+p[0]+'" y="'+p[1]+'" width="'+p[2]+'" height="'+p[2]+'" rx="2" fill="'+p[3]+'" transform="rotate('+p[4]+' '+p[0]+' '+p[1]+')"/>'; }).join(''); }

function character(cx, cy, o){
  var s = '';
  s += '<g transform="rotate('+(o.tilt||0)+' '+cx+' '+cy+')">';
  s += '<ellipse cx="'+cx+'" cy="'+(cy+64)+'" rx="50" ry="32" fill="'+o.shirt+'"/>';
  s += '<path d="M'+(cx-24)+' '+(cy+44)+' Q'+cx+' '+(cy+62)+' '+(cx+24)+' '+(cy+44)+'" stroke="rgba(255,255,255,.55)" stroke-width="5" fill="none" stroke-linecap="round"/>';
  s += '<ellipse cx="'+cx+'" cy="'+(cy-4)+'" rx="42" ry="40" fill="'+o.hair+'"/>';
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="34" fill="'+o.skin+'"/>';
  if(o.beard) s += '<path d="M'+(cx-33)+' '+(cy+2)+' Q'+(cx-36)+' '+(cy+46)+' '+cx+' '+(cy+48)+' Q'+(cx+36)+' '+(cy+46)+' '+(cx+33)+' '+(cy+2)+' Q'+cx+' '+(cy+20)+' '+(cx-33)+' '+(cy+2)+'Z" fill="'+o.hair+'"/>';
  s += '<path d="M'+(cx-34)+' '+(cy-6)+' Q'+(cx-10)+' '+(cy-34)+' '+(cx+34)+' '+(cy-8)+' Q'+(cx+6)+' '+(cy-18)+' '+(cx-34)+' '+(cy-6)+'Z" fill="'+o.hair+'"/>';
  s += '<circle cx="'+(cx-12)+'" cy="'+(cy+2)+'" r="5" fill="#2B1A12"/><circle cx="'+(cx+12)+'" cy="'+(cy+2)+'" r="5" fill="#2B1A12"/>';
  s += '<circle cx="'+(cx-10.5)+'" cy="'+(cy+0.5)+'" r="1.7" fill="#fff"/><circle cx="'+(cx+13.5)+'" cy="'+(cy+0.5)+'" r="1.7" fill="#fff"/>';
  s += '<circle cx="'+(cx-22)+'" cy="'+(cy+13)+'" r="5" fill="#FF8FA3" opacity=".55"/><circle cx="'+(cx+22)+'" cy="'+(cy+13)+'" r="5" fill="#FF8FA3" opacity=".55"/>';
  s += '<path d="M'+(cx-12)+' '+(cy+15)+' Q'+cx+' '+(cy+33)+' '+(cx+12)+' '+(cy+15)+'Z" fill="#fff" stroke="#8A2F1F" stroke-width="2" stroke-linejoin="round"/>';
  s += '<path d="M'+(cx-22)+' '+(cy-26)+' L'+(cx+4)+' '+(cy-80)+' L'+(cx+28)+' '+(cy-22)+'Z" fill="'+o.hat+'"/>';
  s += '<path d="M'+(cx-12)+' '+(cy-44)+' L'+(cx+18)+' '+(cy-48)+' M'+(cx-4)+' '+(cy-62)+' L'+(cx+10)+' '+(cy-64)+'" stroke="rgba(255,255,255,.75)" stroke-width="5" stroke-linecap="round"/>';
  s += '<circle cx="'+(cx+4)+'" cy="'+(cy-82)+'" r="8" fill="#fff"/>';
  s += '</g>';
  return s;
}

function sceneHero(){
  var u = ++uid;
  var bulbs = '';
  var cols = ['#FF5A5F','#FFD23F','#C6F432','#33CCFF','#FF8FD8'];
  for(var i=0;i<12;i++){ var x = 20 + i*40; var y = 12 + 14*Math.sin(i*0.9) + (i%2?4:0); bulbs += '<circle cx="'+x+'" cy="'+(y+6)+'" r="5" fill="'+cols[i%5]+'"/><rect x="'+(x-2)+'" y="'+(y-1)+'" width="4" height="4" fill="#223"/>'; }
  var rays = '';
  for(var r=0;r<12;r++){ var a = r*30*Math.PI/180, a2=(r*30+14)*Math.PI/180; rays += '<path d="M240 160 L'+(240+420*Math.cos(a))+' '+(160+420*Math.sin(a))+' L'+(240+420*Math.cos(a2))+' '+(160+420*Math.sin(a2))+'Z" fill="#fff" opacity=".07"/>'; }
  var inner =
   '<defs><linearGradient id="hb'+u+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3FA8"/><stop offset=".6" stop-color="#18A2C8"/><stop offset="1" stop-color="#3BD6A5"/></linearGradient></defs>' +
   '<rect width="480" height="320" fill="url(#hb'+u+')"/>' + rays +
   '<g transform="translate(0 70)"><path d="M0 190 Q120 160 240 186 T480 176 V230 H0Z" fill="#1E9A55"/><path d="M0 206 Q140 184 270 204 T480 198 V230 H0Z" fill="#157A44"/></g>' +
   '<path d="M0 12 Q120 34 240 12 T480 12" stroke="#223" stroke-width="2" fill="none"/>' + bulbs +
   confetti([[110,60,9,'#FFD23F',20],[372,64,10,'#FF5A5F',-25],[150,176,8,'#C6F432',40],[340,170,9,'#FF8FD8',10],[205,40,7,'#fff',30],[285,48,8,'#C6F432',-15]]) +
   sparkle(150,98,1,'#fff') + sparkle(330,92,.8,'#FFE27A') + sparkle(250,30,.7,'#fff') ;
  return svgWrap('0 0 480 320', inner);
}

function sceneOffice(){
  var u = ++uid, wins = '';
  [58,80,102].forEach(function(y,ri){ [100,128,156].forEach(function(x,ci){ wins += '<rect x="'+x+'" y="'+y+'" width="20" height="14" rx="3" fill="'+(((ri+ci)%3===0)?'#FFE27A':'#5BC0FF')+'"/>'; }); });
  return svgWrap('0 0 300 170',

var done = {};
try { done = JSON.parse(localStorage.getItem('ow-done') || '{}') || {}; } catch(e) { done = {}; }
function save(){ try { localStorage.setItem('ow-done', JSON.stringify(done)); } catch(e) {} }
function $(s){ return document.querySelector(s); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
var GEM = '<svg class="gem"><use href="#gem"/></svg>';

function card(s){
  var mini = s.group === 'warm';
  var b = el('button', 'card ' + (mini ? 'mini' : 'big'));
  b.type = 'button';
  var pillL = s.time ? '<span class="pill l">'+s.time+'</span>' : '<span class="pill l">תחנה '+s.id+'</span>';
  var pillR = done[s.id] ? '<span class="pill r done">✓ הגעתם</span>' : '';
  var art = '<div class="art">'+pillL+pillR+SCENES[s.scene]()+'</div>';
  var rw = '<div class="rw"><small>פרס עד</small><b>'+GEM+' '+s.reward+'</b></div>';
  var tile = '<div class="tile" style="background:'+s.tileBg+'"><svg aria-hidden="true"><use href="#'+s.icon+'"/></svg></div>';
  b.innerHTML = art + (mini
    ? '<div class="gbar"><div class="ti">'+s.title+'</div><div class="su">'+s.sub+'</div>'+rw+'</div>'
    : '<div class="gbar">'+tile+'<div class="tx"><div class="ti">'+s.title+'</div><div class="su">'+s.sub+'</div></div>'+rw+'</div>');
  b.addEventListener('click', function(){ openSheet(s.id); });
  return b;
}

function render(){
  $('#warm').innerHTML=''; $('#main').innerHTML='';
  STOPS.forEach(function(s){ (s.group==='warm' ? $('#warm') : $('#main')).appendChild(card(s)); });
  var n = 0, bal = 0;
  STOPS.forEach(function(s){ if(done[s.id]){ n++; bal += s.reward; } });
  $('#count').textContent = n + ' מתוך ' + STOPS.length;
  $('#bal').textContent = bal;
  var bars = document.querySelectorAll('#bar i');
  STOPS.forEach(function(s,i){ bars[i].className = done[s.id] ? 'on' : ''; });
}

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected', x===t ? 'true':'false'); });
    var f = t.getAttribute('data-f');
    ['warm','main','game'].forEach(function(k){ $('#shelf-'+k).hidden = !(f==='all' || f===k); });
  });
});

var opener = null;
function openSheet(id){
  var s = STOPS.filter(function(x){ return x.id===id; })[0];
  opener = document.activeElement;
  $('#s-art').innerHTML = SCENES[s.scene]();
  $('#s-title').textContent = s.title;
  $('#s-lead').textContent = s.lead;
  $('#s-meta').innerHTML = '<span class="chip">תחנה '+s.id+' מתוך '+STOPS.length+'</span>' + (s.time ? '<span class="chip time">'+s.time+'</span>' : '') + '<span class="chip">'+s.place+'</span>';
  $('#s-reward').innerHTML = GEM + ' פרס הגעה: ' + s.reward + ' גמים';
  $('#s-steps').innerHTML = s.steps.map(function(t){ return '<li>'+t+'</li>'; }).join('');
  buildCta(s);
  var sh = $('#sheet'); sh.classList.add('open'); sh.setAttribute('aria-hidden','false'); sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ $('#back').focus(); }, 50);
}
function buildCta(s){
  var c = $('#s-cta'); c.innerHTML = '';
  if(s.waze){
    var a = el('a','btn waze','<span aria-hidden="true">📍</span> נווטו ב-Waze');
    a.href = s.waze; a.target = '_blank'; a.rel = 'noopener';
    c.appendChild(a);
  }
  var ok = el('button', 'btn ' + (s.waze ? 'ok' : 'main-ok'));
  ok.type = 'button';
  function paint(){ ok.setAttribute('aria-pressed', done[s.id] ? 'true':'false'); ok.textContent = done[s.id] ? '✓ הגעתם לתחנה' : 'הגעתי לתחנה'; }
  paint();
  ok.addEventListener('click', function(){ if(done[s.id]) delete done[s.id]; else done[s.id] = true; save(); paint(); render(); });
  c.appendChild(ok);
}
function closeSheet(){
  var sh = $('#sheet'); sh.classList.remove('open'); sh.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if(opener && opener.focus) opener.focus();
}
$('#back').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if($('#game').classList.contains('open')) closeGame();
  else if($('#sheet').classList.contains('open')) closeSheet();
});

  {q:'באיזו עיר אוכלים ב-Moo ve Moo?', o:['רחובות','ראשון לציון','נתניה','באר שבע'], n:'ב-19:00 השולחן מחכה.'}
];
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var G = {i:0, score:0, marks:[], qs:[], locked:false};
function gStart(){
  G = {i:0, score:0, marks:[], locked:false,
    qs: QUIZ.map(function(q){ return {q:q.q, n:q.n, o:shuffle(q.o.map(function(t,k){ return {t:t, ok:k===0}; }))}; })};
  gRender();
}
function gProg(){
  return '<div class="g-prog">' + G.qs.map(function(_,k){ return '<i class="'+(G.marks[k]===1?'ok':G.marks[k]===0?'no':k===G.i?'cur':'')+'"></i>'; }).join('') + '</div>';
}
function gRender(){
  var w = $('#g-wrap'), n = G.qs.length;
  if(G.i >= n){
    var r = G.score / n;
    var t = r>=.875 ? 'אגדת Offerwall' : r>=.625 ? 'מקצוען אמיתי' : r>=.375 ? 'מתחיל מבטיח' : 'צריך עוד קפה';
    var m = r>=.875 ? 'כמעט בלי טעויות. מגיע לכם כבוד.' : r>=.625 ? 'ידע מרשים. הקפה והארוחה על חשבון הכבוד.' : r>=.375 ? 'לא רע בכלל. יש עוד מקום לצמוח.' : 'לא נורא, החידות בחדר הבריחה יעזרו.';
    w.innerHTML = '<div class="g-res"><div class="g-big">'+G.score+'/'+n+'</div><div class="g-title">'+t+'</div><p>'+m+'</p>'+ gProg() +
      '<div style="width:100%;display:grid;gap:10px;margin-top:10px"><button class="btn main-ok" id="g-again" type="button">שחקו שוב</button><button class="btn ok" id="g-home" type="button">חזרה ל-Offerwall</button></div></div>';
    $('#g-again').addEventListener('click', gStart);
    $('#g-home').addEventListener('click', closeGame);
    return;
  }
  var q = G.qs[G.i];
  w.innerHTML = '<div class="g-top"><span>שאלה '+(G.i+1)+' מתוך '+n+'</span><span class="g-score">ניקוד: '+G.score+'</span></div>' + gProg() +
    '<h2 class="g-q" id="g-q"></h2><div class="g-ans" id="g-ans"></div><div id="g-fb"></div>';
  $('#g-q').textContent = q.q;
  q.o.forEach(function(o){
    var b = el('button','g-opt'); b.type='button'; b.textContent = o.t;
    b.addEventListener('click', function(){ gAnswer(o, b); });
    $('#g-ans').appendChild(b);
  });
  G.locked = false;
}
function gAnswer(o, btn){
  if(G.locked) return; G.locked = true;
  var q = G.qs[G.i];
  G.marks[G.i] = o.ok ? 1 : 0; if(o.ok) G.score++;
  var btns = document.querySelectorAll('#g-ans .g-opt');
  q.o.forEach(function(x,k){ btns[k].disabled = true; if(x.ok) btns[k].classList.add('right'); });
  if(!o.ok) btn.classList.add('wrong');
  var last = G.i === G.qs.length-1;
  var fb = $('#g-fb');
  fb.innerHTML = '<div class="g-note"></div>';
  fb.firstChild.textContent = (o.ok ? 'נכון! ' : 'כמעט. ') + q.n;
  var nx = el('button','btn main-ok'); nx.type='button'; nx.style.marginTop='12px'; nx.textContent = last ? 'לתוצאה' : 'השאלה הבאה';
  nx.addEventListener('click', function(){ G.i++; gRender(); $('#game').scrollTop = 0; });
  fb.appendChild(nx);
  nx.focus();
}
function openGame(){
  opener = document.activeElement;
  gStart();
  var g = $('#game'); g.classList.add('open'); g.setAttribute('aria-hidden','false'); g.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ $('#g-back').focus(); }, 50);
}
function closeGame(){
  var g = $('#game'); g.classList.remove('open'); g.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if(opener && opener.focus) opener.focus();
}
$('#g-back').addEventListener('click', closeGame);

(function(){
  var b = el('button','card big'); b.type = 'button';
  b.innerHTML = '<div class="art"><span class="pill l">8 שאלות</span>'+sceneQuiz()+'</div>' +
    '<div class="gbar"><div class="tile" style="background:linear-gradient(150deg,#FF5FA2,#5B2BD6)"><svg aria-hidden="true"><use href="#ic-quiz"/></svg></div>' +
    '<div class="tx"><div class="ti">טריוויה צוותית</div><div class="su">מי הכי חכם בצוות?</div></div>' +
    '<div class="rw"><small>פרס</small><b>כבוד</b></div></div>';
  b.addEventListener('click', openGame);
  $('#game-card').appendChild(b);
})();
render();
</script>

</body>
