<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{padding:0}body{margin:0}[hidden]{display:none!important}</style><meta charset="utf-8">
<title>Offerwall Team Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: phone-width rewards-wall feed. Illustrated hero, filter tabs, two shelves of glossy gold game cards with cartoon scenes, slide-up detail sheet. */
:root{
  --bg:#0E1730;
  --surface:#18264A;
  --line:#2A3A63;
  --ink:#F4F6FC;
  --muted:#9AA8C7;
  --gold1:#D1A313;
  --gold2:#A67C00;
  --lime:#C6F432;
  --coral:#FF5A5F;
  --waze:#33CCFF;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.gem{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.app{max-width:480px;margin-inline:auto;min-height:100%;position:relative;overflow-x:clip}

/* HERO */
.hero{position:relative;height:320px;overflow:hidden;display:grid;place-items:center;text-align:center;
  padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px))}
.hero > svg{position:absolute;inset:0;width:100%;height:100%}
.faces{position:absolute;inset:0;z-index:1}
.face{position:absolute;width:11.6%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4),0 0 0 2px rgba(10,18,44,.55);background:#18264A}
.hero .txt{position:relative;z-index:2;margin-top:6px}
.hero h1{margin:0;line-height:1;font-weight:900;font-size:clamp(30px,9vw,40px);color:#fff;
  -webkit-text-stroke:2px #0A2A6B;paint-order:stroke fill;
  text-shadow:0 4px 0 #0A2A6B,0 8px 14px rgba(0,0,0,.35)}
.hero h1 .l2{display:block;font-size:clamp(36px,10.5vw,50px);margin-top:2px;
  background:linear-gradient(180deg,#FFF3A0 0%,#FFD23F 45%,#E39A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:0;filter:drop-shadow(0 3px 0 #6B3F00) drop-shadow(0 0 1px #6B3F00)}
.hero .when{display:inline-block;margin-top:12px;padding:5px 16px;border-radius:99px;background:var(--lime);color:#12210A;font-weight:800;font-size:15px;box-shadow:0 3px 0 #8FB31B}
.balance{position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top, 0px));inset-inline-start:max(14px, env(safe-area-inset-right, 0px));
  display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:99px;background:rgba(8,16,40,.72);font-weight:800;font-size:16px;backdrop-filter:blur(4px)}
.balance .gem{font-size:20px}

/* PROGRESS */
.progress{padding:14px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px))}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.progress .t{font-weight:700}
.progress .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.bar i{height:9px;border-radius:99px;background:var(--line);transition:background .25s}
.bar i.on{background:var(--lime)}

/* TABS */
.tabs{display:flex;gap:6px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;font-size:18px;color:var(--muted);font-weight:500;position:relative}
.tab[aria-selected="true"]{color:#FFD23F;font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:auto 12px -1px;height:3px;border-radius:3px;background:#FFD23F}

/* SHELVES */
.shelf{padding:26px 0 8px}
.shelf + .shelf{border-top:1px solid var(--line);margin-top:18px}
.shelf[hidden]{display:none}
.shelf-h{display:flex;align-items:center;gap:14px;padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px));margin-bottom:16px}
.shelf-h svg{width:40px;height:40px;flex:none}
.shelf-h h2{margin:0;font-size:23px;font-weight:800;line-height:1.15}
.shelf-h p{margin:2px 0 0;color:var(--muted);font-size:14px}

.row-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px))}

/* CARDS */
.card{display:block;text-align:start;border-radius:22px;overflow:hidden;position:relative;min-width:0;
  background:linear-gradient(180deg,var(--gold1),var(--gold2));
  box-shadow:0 10px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.card:active{transform:scale(.98)}
.card.big{flex:0 0 80%;scroll-snap-align:start}
.card .art{position:relative;overflow:hidden;line-height:0}
.card.big .art{height:176px}
.card.mini .art{height:132px}
.card .art > svg{width:100%;height:100%;display:block}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 38%);pointer-events:none}
.pill{position:absolute;z-index:2;top:10px;display:flex;align-items:center;gap:5px;line-height:1;padding:6px 10px;border-radius:99px;background:rgba(10,18,44,.78);color:#fff;font-weight:800;font-size:14px;backdrop-filter:blur(4px)}
.pill.l{inset-inline-start:10px}
.pill.r{inset-inline-end:10px}
.pill .gem{font-size:16px}
.pill.done{background:var(--lime);color:#12210A}
.gbar{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff;text-shadow:0 1px 0 rgba(60,40,0,.55)}
.tile{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 3px 6px rgba(0,0,0,.3)}
.tile svg{width:26px;height:26px;fill:#fff;text-shadow:none}
.gbar .tx{flex:1;min-width:0}
.ti{font-weight:800;font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su{font-size:13px;color:#FFF3C4;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw{flex:none;text-align:end;line-height:1.05}
.rw small{display:block;font-size:11px;letter-spacing:.06em;font-weight:700;color:#FFF3C4}
.rw b{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}
.rw b .gem{font-size:18px}
.card.mini .gbar{display:block;padding:11px 12px 12px}
.card.mini .ti{white-space:normal;font-size:16px}
.card.mini .su{white-space:normal}
.card.mini .rw{display:flex;align-items:baseline;justify-content:flex-start;gap:8px;margin-top:8px;text-align:start}
.card.mini .rw small{display:inline}
.card.mini .rw b{font-size:21px}

.foot{padding:26px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));text-align:center;color:var(--muted);font-size:13px}

/* DETAIL SHEET */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:480px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.s-art{height:260px;flex:none;border-radius:0 0 28px 28px;overflow:hidden;line-height:0;position:relative}
.s-art > svg{width:100%;height:100%}
.back{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top, 0px));inset-inline-start:max(14px, env(safe-area-inset-right, 0px));
  width:44px;height:44px;border-radius:50%;background:rgba(14,23,48,.75);display:grid;place-items:center;font-size:22px;backdrop-filter:blur(4px)}
.s-body{padding:22px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));flex:1}
.s-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.chip.time{background:var(--lime);color:#12210A;border-color:transparent}
.s-body h2{margin:0;font-size:32px;font-weight:900;line-height:1.1}
.s-body .lead{margin:8px 0 0;color:var(--muted);font-size:16px}
.reward{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:linear-gradient(180deg,var(--gold1),var(--gold2));font-weight:800;text-shadow:0 1px 0 rgba(60,40,0,.5)}
.reward .gem{font-size:24px}
.s-body h3{margin:26px 0 12px;font-size:14px;letter-spacing:.08em;color:#FFD23F;font-weight:800}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:#FFD23F;color:#2B2100;font-weight:900;display:grid;place-items:center;font-size:14px;margin-top:1px}
.cta{position:sticky;bottom:0;padding:14px max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,rgba(14,23,48,0),var(--bg) 28%);display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;font-weight:800;font-size:18px;width:100%}
.btn.waze{background:var(--waze);color:#06223B;box-shadow:0 6px 0 #1596BE}
.btn.waze:active{transform:translateY(3px);box-shadow:0 3px 0 #1596BE}
.rw b.word{font-size:18px}
.prizes{margin-top:18px}
.prizes .g-h3{margin:0 0 10px}
.prize-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prize-list li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.prize-list .pi{font-size:24px;line-height:1;flex:none}
.prize-list .pt{font-size:15px;font-weight:600}
.btn.dim{opacity:.6;height:auto;min-height:50px;padding:6px 12px;flex-direction:column;gap:2px;cursor:default}
.btn small.sub{display:block;font-size:12px;font-weight:600;color:#FFB3B6}
.btn.waze2{background:transparent;border:2px solid var(--waze);color:var(--waze);height:50px;font-size:16px}
.btn.ok{background:var(--surface);border:2px solid var(--line);color:var(--ink);height:50px;font-size:16px}
.btn.ok[aria-pressed="true"]{background:var(--lime);color:#12210A;border-color:var(--lime)}
.btn.main-ok{background:var(--lime);color:#12210A;box-shadow:0 6px 0 #8FB31B}
.btn.main-ok[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
/* TRIVIA GAME */
.grid1{padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.g-wrap{padding:calc(76px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 32px max(18px, env(safe-area-inset-left, 0px));display:grid;gap:16px;align-content:start}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.g-score{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-variant-numeric:tabular-nums}
.g-prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.g-prog i{height:8px;border-radius:99px;background:var(--line)}
.g-prog i.ok{background:var(--lime)}
.g-prog i.no{background:var(--coral)}
.g-prog i.cur{background:#FFD23F}
.g-q{font-size:26px;font-weight:900;line-height:1.2;margin:8px 0 2px;text-wrap:balance}
.g-ans{display:grid;gap:10px}
.g-opt{text-align:start;padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-size:17px;font-weight:600;color:var(--ink);width:100%}
.g-opt:not(:disabled):active{transform:scale(.98)}
.g-opt:disabled{cursor:default}
.g-opt.right{background:#1C5A2C;border-color:var(--lime)}
.g-opt.wrong{background:#6B1F28;border-color:var(--coral)}
.g-note{padding:12px 14px;border-radius:14px;background:var(--surface);color:var(--muted);font-size:15px}
.g-res{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:8px}
.g-big{font-size:76px;font-weight:900;line-height:1;color:#FFD23F;font-variant-numeric:tabular-nums}
.g-title{font-size:28px;font-weight:900;line-height:1.15}
.g-res p{margin:0;color:var(--muted);font-size:16px}
.g-intro{display:grid;gap:12px}
.g-lab{font-weight:700;font-size:14px;color:#FFD23F}
.g-input{width:100%;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:20px;font-weight:700;padding-inline:16px}
.g-input:focus{outline:none;border-color:#FFD23F}
.g-err{min-height:20px;color:var(--coral);font-size:14px;font-weight:600}
.g-muted{margin:0;color:var(--muted);font-size:14px}
.g-h3{margin:14px 0 4px;font-size:14px;letter-spacing:.08em;color:#FFD23F;font-weight:800}
.g-name{font-size:20px;font-weight:800;color:var(--ink)}
.g-opt.pick{border-color:#FFD23F;background:#3A3210}
.g-prog i.fun{background:#33CCFF}
.g-note.fun{background:#103A52;color:#CFF1FF;font-weight:700;font-size:17px}
.board{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.board li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.board li .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--line);font-variant-numeric:tabular-nums}
.board li:nth-child(1) .rk{background:#FFD23F;color:#2B2100}
.board li:nth-child(2) .rk{background:#D5DCEB;color:#1B2440}
.board li:nth-child(3) .rk{background:#E0A066;color:#2B1500}
.board li .sc{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.board li.me{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.board-wrap{padding:6px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
.board-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px;padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px));font-size:20px;font-weight:800}
.board-h button{font-size:13px;font-weight:700;color:var(--muted);padding:6px 12px;border-radius:99px;border:1px solid var(--line)}
.g-muted.lock{padding:14px 16px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.locked .gated{display:none!important}
.hero{height:auto;display:block;padding:0}
.hero-img{display:block;width:100%;height:auto}
.card .art{background:#18264A}
.card .art img.aimg{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.card .art img.aimg.in,.s-art img.aimg.in{opacity:1}
.s-art{background:#18264A}.s-art img.aimg{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.art .lockart{height:100%;display:grid;place-items:center;font-size:54px;background:linear-gradient(150deg,#1B2A55,#0E1630);line-height:1}
.leave-pop{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.88);display:flex;align-items:center;justify-content:center;padding:18px}
.leave-pop[hidden]{display:none}
.leave-pop .lp{width:100%;max-width:420px;border-radius:22px;overflow:hidden;background:#12203F;border:2px solid #FFD23F;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:lpin .35s ease}
.leave-pop img{display:block;width:100%;height:auto;min-height:200px;background:#18264A}
.leave-pop .lt{padding:14px 16px 16px;text-align:center;display:grid;gap:10px}
.leave-pop .lt b{font-size:22px;font-weight:900}
@keyframes lpin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.locked.showgame #shelf-game{display:block!important}
.locked.showgame .foot{display:none!important}
.lockcard{margin:22px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));padding:22px 18px;border-radius:22px;text-align:center;background:linear-gradient(180deg,var(--surface),#12203F);border:1px dashed var(--line);display:grid;gap:8px;justify-items:center}
.lockcard[hidden]{display:none}
.lc-ic{font-size:40px;line-height:1}
.lockcard h2{margin:0;font-size:22px;font-weight:900;line-height:1.2}
.code-form{display:grid;gap:8px;width:100%;max-width:320px;margin-top:10px;text-align:start}
.code-in{text-align:center;letter-spacing:.5em;font-size:24px}
.lc-when{margin:0;font-size:26px;font-weight:900;color:#FFD23F}
.rides{display:grid;gap:14px;padding-inline:max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.r-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.r-big{font-size:20px;font-weight:900}
.r-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.r-bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s}
.r-ok{color:var(--lime);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip.need{background:#4A3A12;border-color:#E0A21A;color:#FFE9B0}
.chip.warn{background:#4A1F2A;border-color:var(--coral);color:#FFD6D8}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px;background:#5BD282}
.legend i.need{background:#E0A21A}
.legend i.warn{background:var(--coral)}
.chip.ok{background:#1F5A34;border-color:#5BD282;color:#EAFFF0;display:inline-flex;align-items:center;gap:6px}
.chip .x{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.15);font-size:12px;line-height:1}
.r-row{display:flex;gap:10px}
.r-row .g-input{flex:1;min-width:0}
.r-act{display:grid;gap:10px}
.r-act .btn{height:50px;font-size:16px}
.r-line{margin:0;font-weight:800;font-size:17px}
.r-msg{margin:0;min-height:18px;color:#FFB3B6;font-size:14px;font-weight:600}
.seatpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.seatbtn{height:48px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-weight:900;font-size:20px}
.seatbtn.cur,.seatbtn:active{background:#FFD23F;color:#2B2100;border-color:#FFD23F}
.r-cars{display:grid;gap:12px}
.r-cars .g-h3{margin:6px 0 0}
.car{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:10px}
.car.full{opacity:.85}
.car-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.car-t{font-weight:900;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.car-n{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;color:#FFD23F}
.seats{display:flex;gap:6px}
.seat{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--bg)}
.seat.on{background:var(--lime);border-color:var(--lime)}
.round-msg{padding:6px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));min-height:20px;color:#FFD23F;font-weight:700}
.card.lockedcard .art{filter:grayscale(.85) brightness(.7)}
.board li .nm{display:grid;gap:2px;min-width:0}
.board li .n1{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .rs{color:var(--muted);font-size:12px;font-weight:600}
.g-sub{color:var(--muted);font-weight:700}
.stage-banner{position:fixed;z-index:45;top:calc(8px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:460px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--lime);color:#12210A;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.stage-banner #sb-text{flex:1;min-width:0}
.stage-banner .sb-go{background:#12210A;color:var(--lime);border-radius:12px;padding:8px 14px;font-weight:800}
.stage-banner .sb-x{width:30px;height:30px;border-radius:50%;background:rgba(18,33,10,.15);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- Illustrations (original cartoon scenes) ---------- */
var uid = 0;
function svgWrap(vb, inner){ return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+inner+'</svg>'; }

function sparkle(x,y,s,c){ return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10z" fill="'+c+'"/>'; }
function confetti(list){ return list.map(function(p){ return '<rect x="'+p[0]+'" y="'+p[1]+'" width="'+p[2]+'" height="'+p[2]+'" rx="2" fill="'+p[3]+'" transform="rotate('+p[4]+' '+p[0]+' '+p[1]+')"/>'; }).join(''); }

function character(cx, cy, o){
  var s = '';
  s += '<g transform="rotate('+(o.tilt||0)+' '+cx+' '+cy+')">';
  s += '<ellipse cx="'+cx+'" cy="'+(cy+64)+'" rx="50" ry="32" fill="'+o.shirt+'"/>';
  s += '<path d="M'+(cx-24)+' '+(cy+44)+' Q'+cx+' '+(cy+62)+' '+(cx+24)+' '+(cy+44)+'" stroke="rgba(255,255,255,.55)" stroke-width="5" fill="none" stroke-linecap="round"/>';
  s += '<ellipse cx="'+cx+'" cy="'+(cy-4)+'" rx="42" ry="40" fill="'+o.hair+'"/>';
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="34" fill="'+o.skin+'"/>';
  if(o.beard) s += '<path d="M'+(cx-33)+' '+(cy+2)+' Q'+(cx-36)+' '+(cy+46)+' '+cx+' '+(cy+48)+' Q'+(cx+36)+' '+(cy+46)+' '+(cx+33)+' '+(cy+2)+' Q'+cx+' '+(cy+20)+' '+(cx-33)+' '+(cy+2)+'Z" fill="'+o.hair+'"/>';
  s += '<path d="M'+(cx-34)+' '+(cy-6)+' Q'+(cx-10)+' '+(cy-34)+' '+(cx+34)+' '+(cy-8)+' Q'+(cx+6)+' '+(cy-18)+' '+(cx-34)+' '+(cy-6)+'Z" fill="'+o.hair+'"/>';
  s += '<circle cx="'+(cx-12)+'" cy="'+(cy+2)+'" r="5" fill="#2B1A12"/><circle cx="'+(cx+12)+'" cy="'+(cy+2)+'" r="5" fill="#2B1A12"/>';
  s += '<circle cx="'+(cx-10.5)+'" cy="'+(cy+0.5)+'" r="1.7" fill="#fff"/><circle cx="'+(cx+13.5)+'" cy="'+(cy+0.5)+'" r="1.7" fill="#fff"/>';
  s += '<circle cx="'+(cx-22)+'" cy="'+(cy+13)+'" r="5" fill="#FF8FA3" opacity=".55"/><circle cx="'+(cx+22)+'" cy="'+(cy+13)+'" r="5" fill="#FF8FA3" opacity=".55"/>';
  s += '<path d="M'+(cx-12)+' '+(cy+15)+' Q'+cx+' '+(cy+33)+' '+(cx+12)+' '+(cy+15)+'Z" fill="#fff" stroke="#8A2F1F" stroke-width="2" stroke-linejoin="round"/>';
  s += '<path d="M'+(cx-22)+' '+(cy-26)+' L'+(cx+4)+' '+(cy-80)+' L'+(cx+28)+' '+(cy-22)+'Z" fill="'+o.hat+'"/>';
  s += '<path d="M'+(cx-12)+' '+(cy-44)+' L'+(cx+18)+' '+(cy-48)+' M'+(cx-4)+' '+(cy-62)+' L'+(cx+10)+' '+(cy-64)+'" stroke="rgba(255,255,255,.75)" stroke-width="5" stroke-linecap="round"/>';
  s += '<circle cx="'+(cx+4)+'" cy="'+(cy-82)+'" r="8" fill="#fff"/>';
  s += '</g>';
  return s;
}

function sceneHero(){

   sparkle(150,98,1,'#fff') + sparkle(330,92,.8,'#FFE27A') + sparkle(250,30,.7,'#fff') ;
  return svgWrap('0 0 480 320', inner);
}

/* Shared leaderboard lives at /api/scores (served by api/scores.js on Vercel). Empty string = scores stay on this device only. */
var SCORE_URL = '/api/scores';

var QCACHE = {};     /* questions are fetched from the server only when a round is open */
var ROUND_META = {1:{title:'סבב 1', sub:'בדרך לחדר הבריחה'}, 2:{title:'סבב 2', sub:'אחרי החדר, בדרך למסעדה'}};
/* Which rounds are open is decided by the server clock (14.12.2026: round 1 at 16:00, round 2 at 18:00 Israel time). */
var ROUND_TIME = {1:'16:00', 2:'18:00'};
var STATUS = {r1:false, r2:false, leave:false, owner:false, counts:null};
function testMode(){ return !!STATUS.owner; }   /* organiser preview: sees everything, nothing is saved to the shared table */
function roundOpen(r){ return STATUS.owner || !!STATUS['r' + r]; }
function roundQs(r){ return QCACHE[r] || []; }
function ownerKey(){ try { return localStorage.getItem('ow-k') || ''; } catch(e){ return ''; } }
function apiGet(url){
  var k = ownerKey(), opts = {cache:'no-store'};
  if(k) opts.headers = {'x-owner': k};
  return fetch(url + (url.indexOf('?')<0 ? '?' : '&') + 't=' + Date.now(), opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok){ var e = new Error(j.error || ('HTTP ' + r.status)); e.code = j.error; throw e; } return j; });
  });
}
function loadRoundQs(r){
  if(QCACHE[r]) return Promise.resolve();
  return apiGet('/api/quiz?round=' + r).then(function(j){ QCACHE[r] = j.qs || []; if(j.prizes && j.prizes.length){ PRIZES = j.prizes; paintPrizes(); } });
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ----- name + stored results ----- */
function getName(){ try { return localStorage.getItem('ow-name') || ''; } catch(e){ return ''; } }
function setName(v){ try { localStorage.setItem('ow-name', v); } catch(e){} }
function pkey(r){ return (testMode() ? 'ow-test-played-' : 'ow-played-') + r; }
function getPlayed(r){ try { return JSON.parse(localStorage.getItem(pkey(r)) || 'null'); } catch(e){ return null; } }
function setPlayed(r, o){ try { localStorage.setItem(pkey(r), JSON.stringify(o)); } catch(e){} }
function anyPlayedName(){ var p = getPlayed(1) || getPlayed(2); return p ? p.name : getName(); }

/* ----- leaderboard storage (shared via /api/scores) ----- */
function localBoard(){ try { return JSON.parse(localStorage.getItem('ow-board') || '[]'); } catch(e){ return []; } }
function addLocal(o){
  var l = localBoard(), k = o.name.toLowerCase(), f = l.filter(function(x){ return String(x.name).toLowerCase()===k; })[0];
  if(!f){ f = {name:o.name, score:0, total:0, r1:null, r2:null, t:Date.now()}; l.push(f); }
  if(!f['r'+o.round]){ f['r'+o.round] = {score:o.score, total:o.total}; f.score += o.score; f.total += o.total; }
  l.sort(function(a,b){ return b.score - a.score || a.t - b.t; });
  try { localStorage.setItem('ow-board', JSON.stringify(l)); } catch(e){}
}
function fetchBoard(){
  if(!SCORE_URL) return Promise.resolve(localBoard());
  return fetch(SCORE_URL + (SCORE_URL.indexOf('?')<0 ? '?' : '&') + 't=' + Date.now()).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(j){
      if(!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
      if(!Array.isArray(j)) throw new Error('bad response');
      return j;
    });
  });
}
function nameTaken(name, round){
  if(testMode()) return Promise.resolve(false);
  return fetchBoard().then(function(list){ var k = name.toLowerCase(); return (list || []).some(function(x){ return String(x.name).toLowerCase()===k && x['r'+round]; }); }).catch(function(){ return false; });
}
function postScore(o){
  var abs = /^https?:/.test(SCORE_URL);
  var opts = abs ? {method:'POST', mode:'no-cors', body:JSON.stringify(o)}
                 : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(o)};
  return fetch(SCORE_URL, opts).then(function(r){ if(!abs && !r.ok) throw new Error('save failed'); });
}
function getPending(){ try { var a = JSON.parse(localStorage.getItem('ow-pending2') || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
function setPending(a){ try { if(a && a.length) localStorage.setItem('ow-pending2', JSON.stringify(a)); else localStorage.removeItem('ow-pending2'); } catch(e){} }
/* A score that could not be saved (no signal, server hiccup) is kept and re-sent automatically. */
var flushing = null;
function flushPending(){
  var q = getPending();
  if(!q.length || !SCORE_URL) return Promise.resolve();
  if(flushing) return flushing;
  var rest = [];
  flushing = q.reduce(function(p, o){ return p.then(function(){ return postScore(o).catch(function(){ rest.push(o); }); }); }, Promise.resolve())
    .then(function(){ setPending(rest); flushing = null; }, function(){ flushing = null; });
  return flushing;
}
function submitScore(o){
  if(testMode()) return Promise.resolve();
  if(!SCORE_URL){ addLocal(o); return Promise.resolve(); }
  var q = getPending(); q.push(o); setPending(q);
  return flushPending();
}
function boardEl(list, me, limit){
  var wrap = el('div','board-box');
  if(!list || !list.length){ wrap.appendChild(el('p','g-muted','עוד אין תוצאות. תהיו הראשונים!')); return wrap; }
  var ol = el('ol','board');
  list.slice(0, limit || 50).forEach(function(x, i){
    var li = el('li', me && String(x.name).toLowerCase()===me.toLowerCase() ? 'me' : '');
    var rk = el('span','rk'); rk.textContent = i+1;
    var nm = el('span','nm');
    var n1 = el('span','n1'); n1.textContent = x.name; nm.appendChild(n1);
    var parts = [];
    if(x.r1) parts.push('סבב 1: ' + Number(x.r1.score) + '/' + Number(x.r1.total));
    if(x.r2) parts.push('סבב 2: ' + Number(x.r2.score) + '/' + Number(x.r2.total));
    if(parts.length){ var rs = el('small','rs'); rs.textContent = parts.join(' · '); nm.appendChild(rs); }
    var sc = el('span','sc'); sc.textContent = Number(x.score) + '/' + Number(x.total);
    li.appendChild(rk); li.appendChild(nm); li.appendChild(sc); ol.appendChild(li);
  });
  wrap.appendChild(ol);
  return wrap;
}
function showBoard(target, me, limit, silent){
  if(!target) return;
  if(!silent) target.innerHTML = '<p class="g-muted">טוען טבלה…</p>';
  fetchBoard().then(function(list){
    target.innerHTML = '';
    target.appendChild(boardEl(list, me, limit));
    if(!SCORE_URL) target.appendChild(el('p','g-muted','הטבלה שמורה כרגע רק במכשיר הזה.'));
  }).catch(function(err){
    if(silent) return;
    target.innerHTML = '';
    target.appendChild(el('p','g-muted','לא הצלחנו לטעון את הטבלה. נסו שוב בעוד רגע.'));
    var d = el('p','g-muted'); d.setAttribute('dir','ltr'); d.textContent = 'Error: ' + (err && err.message ? err.message : 'unknown');
    target.appendChild(d);
  });
}

/* ----- game flow ----- */
var G = {round:1, done:false, stage:'intro', i:0, score:0, total:0, marks:[], qs:[], locked:false, name:'', submitted:false};
function gBuild(){
  G.qs = roundQs(G.round).map(function(q){
    if(q.fun) return {q:q.q, fun:true, o:q.o.map(function(x){ return {t:x.t, r:x.r}; })};
    return {q:q.q, n:q.n, o:shuffle(q.o.map(function(t,k){ return {t:t, ok:k===0}; }))};
  });
  G.total = G.qs.filter(function(q){ return !q.fun; }).length;
  G.i = 0; G.score = 0; G.marks = []; G.locked = false; G.submitted = false; G.done = false;
}
function gProg(){
  return '<div class="g-prog">' + G.qs.map(function(_,k){
    var m = G.marks[k]; var c = m===1 ? 'ok' : m===0 ? 'no' : m===2 ? 'fun' : (k===G.i && G.stage==='q') ? 'cur' : '';
    return '<i class="'+c+'"></i>'; }).join('') + '</div>';
}
function combined(){
  var s = 0, t = 0;
  [1,2].forEach(function(r){ var p = getPlayed(r); if(p){ s += p.score; t += p.total; } });
  return {score:s, total:t};
}
function gRender(){
  var w = $('#g-wrap'), meta = ROUND_META[G.round];
  if(G.stage === 'intro'){
    w.innerHTML = '<div class="g-intro"><div class="g-title"></div><p class="g-muted">כתבו את השם שלכם כדי לשמור ניקוד. אפשר לשחק כל סבב פעם אחת בלבד, והציון הראשון הוא הקובע. הציונים של שני הסבבים מצטברים.</p>' +
      '<label class="g-lab" for="g-name">בחרו את השם שלכם</label><select id="g-name" class="g-input"></select><input id="g-other" class="g-input" type="text" maxlength="20" autocomplete="off" placeholder="כתבו את השם שלכם" hidden>' +
      '<div class="g-err" id="g-err" role="alert"></div><button class="btn main-ok" id="g-go" type="button">יאללה, מתחילים</button>' +
      '<div id="g-prizes"></div><h3 class="g-h3">טבלת מובילים</h3><div id="g-board"></div></div>';
    $('.g-title').textContent = 'טריוויה צוותית · ' + meta.title;
    $('#g-prizes').appendChild(prizesEl());
    var sel = $('#g-name'), oth = $('#g-other'), me0 = getName();
    var o0 = h('option','','בחרו את השם שלכם'); o0.value = ''; sel.appendChild(o0);
    ROSTER.forEach(function(n){ var o = h('option','',n); o.value = n; sel.appendChild(o); });
    if(me0 && ROSTER.indexOf(me0) < 0){ var ox = h('option','',me0); ox.value = me0; sel.appendChild(ox); }
    var oo = h('option','','השם שלי לא ברשימה…'); oo.value = '__other'; sel.appendChild(oo);
    sel.value = me0 || '';
    sel.addEventListener('change', function(){ oth.hidden = sel.value !== '__other'; if(!oth.hidden) oth.focus(); $('#g-err').textContent = ''; });
    function go(){
      var v = sel.value === '__other' ? oth.value.replace(/\s+/g,' ').trim() : sel.value;
      if(!v){ $('#g-err').textContent = 'בחרו את השם שלכם מהרשימה.'; sel.focus(); return; }
      if(v.length < 2){ $('#g-err').textContent = 'כתבו שם של לפחות 2 תווים.'; oth.focus(); return; }
      var btn = $('#g-go'); btn.disabled = true; $('#g-err').textContent = '';
      nameTaken(v, G.round).then(function(taken){
        if(taken){ btn.disabled = false; $('#g-err').textContent = 'השם הזה כבר שיחק בסבב הזה. אם זה אתם, פנו לרוהי.'; return; }
        G.name = v; setName(v); gBuild(); G.stage = 'q'; gRender(); $('#game').scrollTop = 0;
      });
    }
    $('#g-go').addEventListener('click', go);
    oth.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
    showBoard($('#g-board'), getName(), 20);
    return;
  }
  if(G.stage === 'res'){
    if(!G.done && !G.submitted){ setPlayed(G.round, {name:G.name, score:G.score, total:G.total}); }
    var cb = combined();
    var r = cb.total ? cb.score / cb.total : 0;
    var t = r>=.875 ? 'אגדת Offerwall' : r>=.625 ? 'מקצוען אמיתי' : r>=.375 ? 'מתחיל מבטיח' : 'צריך עוד קפה';
    var m = r>=.875 ? 'כמעט בלי טעויות. מגיע לכם כבוד.' : r>=.625 ? 'ידע מרשים. הקפה והארוחה על חשבון הכבוד.' : r>=.375 ? 'לא רע בכלל. יש עוד מקום לצמוח.' : 'לא נורא, עוד יש סבבים.';
    var other = G.round === 1 ? 2 : 1;
    var hint = '';
    if(!getPlayed(other)) hint = roundOpen(other) ? ('סבב ' + other + ' פתוח. אפשר לשחק עכשיו.') : ('סבב ' + other + ' ייפתח ב-' + ROUND_TIME[other] + '.');

  else if(action === 'own') ride[me] = {r:'own'};
  else if(action === 'clear'){ Object.keys(ride).forEach(function(n){ if(ride[n].r === 'rider' && ride[n].c === me) delete ride[n]; }); delete ride[me]; }

function rideAct(action, param){
  var me = getName();

    .then(function(j){ rideMsg(j.ok ? '' : (RIDE_MSG[j.code] || RIDE_MSG.bad)); })
    .catch(function(){ rideMsg('אין חיבור כרגע. השינוי לא נשמר, נסו שוב.'); })

/* ---------- Access: the server decides what this visitor may see ---------- */
function isUnlocked(){ return !!(STATUS.owner || STATUS.r1 || STATUS.r2); }
function applyLock(){

  var app = $('.app');
  app.classList.toggle('locked', !owner);

function loadStatus(){

    if(j.bad){ try { localStorage.removeItem('ow-k'); } catch(e){} }
    STATUS = {r1:!!j.r1, r2:!!j.r2, leave:!!j.leave, owner:!!j.owner, counts:j.counts || null};
    var p = Promise.resolve();
    if(STATUS.owner && !STOPS.length){
      p = apiGet('/api/quiz?stops=1').then(function(x){ STOPS = x.stops || []; render(); });
    }
    if((STATUS.owner || STATUS.r1) && !PRIZES.length){ p = p.then(function(){ return loadRoundQs(1).catch(function(){}); }); }
    if(!STATUS.owner && STOPS.length){ STOPS = []; $('#main').innerHTML = ''; }
    return p.then(function(){ applyLock(); renderRounds(); checkRounds(); checkLeave(); });
  }).catch(function(){ /* offline: keep what we have */ });
}
function leaveSeen(){ try { return localStorage.getItem('ow-leave') === '1'; } catch(e){ return false; } }
function checkLeave(){
  var pop = $('#leave-pop');
  if(!STATUS.leave || STATUS.owner || leaveSeen() || !pop.hidden) return;
  imgBlob('leave').then(function(u){
    $('#lp-img').src = u; pop.hidden = false;
    try { if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]); } catch(e){}
  }).catch(function(){});
}
$('#lp-ok').addEventListener('click', function(){ try { localStorage.setItem('ow-leave','1'); } catch(e){} $('#leave-pop').hidden = true; });
applyLock();
loadStatus();
setInterval(function(){ if(!document.hidden) loadStatus(); }, 20000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadStatus(); });
$('#code-form').addEventListener('submit', function(e){
  e.preventDefault();
  var v = $('#code-in').value.trim();
  if(!v) return;
  try { localStorage.setItem('ow-k', v); } catch(err){}
  $('#code-err').textContent = '';
  loadStatus().then(function(){
    if(STATUS.owner){ $('#code-in').value = ''; window.scrollTo(0, 0); }
    else { $('#code-err').textContent = 'הקוד לא נכון.'; $('#code-in').select(); }
  });
});
checkRounds();
setInterval(checkRounds, 20000);
</script></body></html>
